[package]
name = "leverage-scoring"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8.6", features = ["macros", "json"] }
tokio = { version = "1.37", features = ["full"] }

# Solana client + SDK
solana-client = "2.1"
solana-sdk = "2.1"
solana-transaction-status = "2.1"

# Error handling + serialization
anyhow = "1"
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Env configuration + logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
reqwest = "0.12.24"
hex = "0.4.3"
alloy-primitives = "1.4.1"
anchor-client = "0.31.1"
anchor-lang = "0.31.1"
alloy-signer = "1.0.41"
chrono = "0.4.42"
sha2 = "0.10.9"
